<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - DIDSS TapHouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="wrap">
        <header class="navbar navbar-dark bg-taphouse mb-4 p-3 rounded">
            <span class="navbar-brand fw-bold">
                <img src="{{ url_for('static', filename='images/TapHouseLogo.png') }}" alt="TapHouse Logo" class="navbar-logo"> DIDSS TapHouse
            </span>
        </header>

        <main class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                <div class="card shadow-sm p-4">
                    <h2 class="h4 mb-1">Manager sign in</h2>
                    <p class="text-muted small mb-4">Inventory decision support for TapHouse Sports Bar and Grill.</p>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}

                    <form method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email }}"
                                   autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </form>
                    <p class="text-muted small mt-3 mb-0">Test account: see the README.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
